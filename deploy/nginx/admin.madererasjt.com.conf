# Nginx — admin.madererasjt.com (mismo upstream que el sitio principal)
# Colocar en /etc/nginx/sites-available/admin.madererasjt.com y enlazar en sites-enabled.
# client_max_body_size 6M: margen sobre el límite de 5MB que valida la app,
# para que Nginx no rechace con 413 imágenes cercanas al límite antes de la app.
server {
    listen 80;
    server_name admin.madererasjt.com;

    client_max_body_size 6M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

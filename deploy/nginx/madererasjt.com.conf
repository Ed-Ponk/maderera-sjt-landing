# Nginx — madererasjt.com (sitio público + /admin en el mismo dominio)
# Merge: si ya existe un server block para madererasjt.com, agregar la línea
# `client_max_body_size 6M;` dentro de él (server scope) y recargar.
server {
    listen 80;
    server_name madererasjt.com www.madererasjt.com;

    # CRÍTICO para el admin: sin esto Nginx responde 413 antes que la app
    # para cualquier imagen cercana a 5MB (límite de la app) subida por
    # madererasjt.com/admin/*.
    client_max_body_size 6M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

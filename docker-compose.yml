version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maderera_sjt_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar en .env}
      POSTGRES_DB: maderera_sjt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: maderera_sjt_app
    restart: always
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - images_data:/var/lib/maderera-sjt/images
    depends_on:
      - postgres

volumes:
  postgres_data:
  images_data:
